name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
      PYTHONDONTWRITEBYTECODE: "1"
      # Ordinary tests inject tokenizers/encoders and mock Ollama HTTP responses.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      # These credentials belong only to the ephemeral service created below.
      TEST_DATABASE_URL: postgresql+asyncpg://study_rag_test:study_rag_test@127.0.0.1:5432/study_rag_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: study_rag_test
          POSTGRES_PASSWORD: study_rag_test
          POSTGRES_DB: study_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study_rag_test -d study_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies
        # The optional HF inference stack is unnecessary for model-boundary tests.
        run: uv sync --locked --group dev

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test frontend contracts
        run: npm test --prefix frontend

      - name: Build packaged GUI
        run: npm run build --prefix frontend

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check Ruff rules
        run: uv run --no-sync ruff check .

      - name: Check strict types
        run: uv run --no-sync mypy --strict .

      - name: Check COP rules
        run: uv run --no-sync flake8 src tests scripts

      - name: Run tests with PostgreSQL and embedded Qdrant
        # Fixtures migrate isolated PostgreSQL schemas; run serially.
        run: uv run --no-sync pytest -q --strict-markers -m "not local_models"
