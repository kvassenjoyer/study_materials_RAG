[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "ragumentation"
version = "0.1.0"
description = "RAGumentation: local study materials search with the RAGent assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.142.2,<0.143",
    "uvicorn>=0.54.0,<0.55",
    "sqlalchemy[asyncio]>=2.1.3,<2.2",
    "asyncpg>=0.31.0,<0.32",
    "alembic>=1.20.0,<1.21",
    "httpx>=0.28.1,<0.29",
    "qdrant-client>=1.19.1,<1.20",
    "tokenizers>=0.23.2,<0.24",
    # tokenizers 0.23 requires huggingface-hub below its incompatible 2.x API.
    "huggingface-hub>=1.0,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.15.0,<2.16",
    "pwdlib[argon2]>=0.3.1,<0.4",
    "pyjwt>=2.15.1,<3",
    "pypdf>=6.19.0,<7",
    "python-multipart>=0.0.32,<0.1",
    "email-validator>=2.3.0,<3",
    "pydantic-ai-slim[ag-ui]==2.54.0",
]

[project.optional-dependencies]
huggingface = [
    "sentence-transformers>=6.1.0,<7",
    "torch>=2.14.1,<3",
    "transformers>=5.18.0,<6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10,<0.17",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "flake8-pyproject>=1.2.4,<2",
    "community-of-python-flake8-plugin>=0.6.0,<0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/study_rag"]
artifacts = ["src/study_rag/web/**"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".local", ".data", ".agents"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
external = ["COP"]
# Explicit keyword-only DI and protocol contracts legitimately exceed five arguments.
# No copyright holder or licence has been selected for this new repository.
ignore = ["EM", "FBT", "TRY003", "D1", "D203", "D213", "G004", "FA", "COM812", "ISC001", "PLR0913", "CPY001"]

[tool.ruff.lint.isort]
no-lines-before = ["standard-library", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["S101", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/study_rag"]
mypy_path = "src"

[tool.flake8]
select = ["COP"]
# This plugin's verb whitelist rejects valid domain actions; named intermediate results
# are deliberately allowed by the supplied skill when they explain significant stages.
# The archived adaptation permits descriptive loop names and ordinary intentional
# reassignment; it does not require one_ prefixes or an external Mutable marker.
ignore = ["COP009", "COP011", "COP015", "COP017"]
exclude = [".venv", ".cache", ".data", ".local", ".agents"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "torch", "torch.*"]
# Optional runtime imports are confined to the explicitly selected HF adapter boundary.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires an explicitly configured PostgreSQL test database",
    "local_models: requires downloaded local EmbeddingGemma and Qwen models",
]

[tool.coverage.run]
source = ["study_rag"]
branch = true

[tool.coverage.report]
exclude_also = ["if typing.TYPE_CHECKING:"]
